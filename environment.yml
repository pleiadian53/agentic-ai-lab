name: agentic-ai
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11

  # === Agent + LLM Tools ===
  - pip
  - openai
  - markdown
  - requests
  - weasyprint  # PDF generation (markdown without equations)
  - pandoc      # Document converter (requires LaTeX engine)
  - tectonic    # Modern LaTeX engine for equation rendering (recommended)
  
  # === Web Framework + API ===
  # Used by: tool_use/ml_agent, tool_use/email_agent, chart_agent/server, nexus agents
  - fastapi
  - pydantic
  - python-dotenv
  - python-multipart
  - sqlalchemy
  - uvicorn
  - beautifulsoup4  # HTML parsing for nexus
  
  # === Notebook Experience ===
  - ipywidgets
  - jupyter
  - jupyter_server
  - nbclassic
  - notebook
  - ipykernel
  
  # === Data Analysis / Display ===
  # Used by: chart_agent (code generation & execution), multiagent examples
  - duckdb       # Efficient dataset loading
  - matplotlib   # Plotting library
  - numpy        # Numerical computing
  - pandas       # Data manipulation
  - seaborn      # Statistical visualization
  - tabulate     # Pretty-print tables
  
  # === Machine Learning / NLP ===
  - jinja2
  - psycopg2
  - scikit-learn
  
  # Packages only available via pip
  - pip:
    # Agent & LLM specific packages not in conda-forge
    - aisuite==0.1.11
    - anthropic>=0.51.0
    - arxiv>=2.2.0        # arXiv API (used by mcp tutorials, research)
    - docstring-parser
    - mistralai
    - pypandoc  # Python wrapper for pandoc (LaTeX PDF generation)
    - qrcode
    - tavily-python>=0.7.12
    - textstat
    - vertexai
    
    # Pydantic extensions
    - pydantic[email]
    
    # Additional pip-only packages
    - tinydb
    - wikipedia
    - pdfminer.six
    - pymupdf
    
    # === Knowledge Graph (Neo4j + LangChain) ===
    # Used by: knowledge_graph/ sub-project, notebooks/knowledge_graph/
    - langchain>=0.3.0           # LangChain core
    - langchain-community>=0.3.0 # LangChain community integrations (RAG, etc.)
    - langchain-neo4j>=0.3.0     # Neo4jGraph (official successor to langchain_community.graphs.Neo4jGraph)
    - neo4j>=5.0.0               # Official Neo4j Python driver

    # === RAG (Retrieval-Augmented Generation) ===
    # Used by: rag/ sub-project, notebooks/RAG/
    - together>=1.4.0        # Together.ai SDK (LLM API)
    - adjustText             # Label placement for embedding visualizations
    - sentence-transformers  # Embedding models
    - weaviate-client>=4.0   # Weaviate vector DB client
    - FlagEmbedding          # BGE reranker models
    - flask                  # Local embedding/reranking server
    - psutil                 # Process management
    
    # === MCP (Model Context Protocol) ===
    # Used by: mcp/ tutorials and future MCP integrations
    - mcp>=1.7.1
    - pypdf2>=3.0.1
